    position: absolute;

    left: 0;
    width: 100%;
    height: 100%;

    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;

    opacity: 1;
  }

    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  
  .preview-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.3) 100%);

    align-items: flex-start;
    z-index: 10;

// 格式化时间
function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  const ms = Math.floor((seconds % 1) * 100);
  return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
}

function formatTimeSimple(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${String(secs).padStart(2, '0')}`;
}

// 获取当前段落
function getCurrentSection() {
  for (let i = 0; i < timeline.length; i++) {
    if (currentTime >= timeline[i].start && currentTime < timeline[i].end) {
      return { section: timeline[i], index: i };
    }
  }
  return { section: timeline[timeline.length - 1], index: timeline.length - 1 };
}

    layer.classList.remove('active');
    const video = layer.querySelector('video');
    if (video) video.pause();
  });
  
  const target = document.getElementById('bg-' + bgId);
  if (target) {
    target.classList.add('active');
    const video = target.querySelector('video');
    if (video && isPlaying) {
      video.play().catch(() => {});
    }
  }
}

// 更新显示
function updateDisplay() {
  const { section, index } = getCurrentSection();
  
  // 更新时间
  document.getElementById('timeDisplay').innerHTML = 
    formatTime(currentTime).replace('.', '<span class="ms">.') + '</span>';
  document.getElementById('currentTimeLabel').textContent = formatTimeSimple(currentTime);
  
  // 更新进度条
  const progress = (currentTime / TOTAL_DURATION) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  
  // 更新段落标签
  document.getElementById('sectionBadge').textContent = section.title;
  
  // 更新背景
  switchBackground(section.bg);
  
  // 更新台词
  updateScript(section);
  
  // 更新时间线
  updateTimelineHighlight(index);
}

// 更新台词
function updateScript(section) {
  const scripts = section.scripts;
  let currentIdx = 0;
  
  for (let i = 0; i < scripts.length; i++) {
    if (currentTime >= scripts[i].time) {
      currentIdx = i;
    }
  }
  
  const currentText = scripts[currentIdx]?.text || '';
  const nextText = scripts[currentIdx + 1]?.text || '';
  
  document.getElementById('currentScript').innerHTML = `
    <div class="speaker-name">${section.speaker || ''}</div>
    <div class="script-text">${currentText}</div>
    <div class="script-text next">${nextText}</div>
  `;
}

// 生成时间线
function generateTimeline() {
  const container = document.getElementById('timeline');
  let html = '';
  
  timeline.forEach((item, index) => {
    html += `
      <div class="timeline-item" id="tl-${index}" onclick="jumpTo(${item.start})">
        <div class="timeline-time">${formatTimeSimple(item.start)}</div>
        <div class="timeline-content">
          <div class="timeline-name">${item.title}</div>
          <div class="timeline-desc">${item.desc}</div>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// 更新时间线高亮
function updateTimelineHighlight(activeIndex) {
  document.querySelectorAll('.timeline-item').forEach((item, i) => {
    item.classList.toggle('active', i === activeIndex);
  });
}

// 播放/暂停
function togglePlay() {
  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');
  
  if (isPlaying) {
    btn.textContent = '⏸ 暂停';
    startTimer();
    playCurrentVideo();
  } else {
    btn.textContent = '▶ 播放';
    stopTimer();
    pauseAllVideos();
  }
}

function startTimer() {
  stopTimer();
  const interval = 50;
  
  timer = setInterval(() => {
    currentTime += (playSpeed * interval) / 1000;
    
    if (currentTime >= TOTAL_DURATION) {
      currentTime = TOTAL_DURATION;
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ 播放';
      stopTimer();
      pauseAllVideos();
    }
    
    updateDisplay();
  }, interval);
}

function stopTimer() {
  if (timer) {
    clearInterval(timer);
    timer = null;
  }
}

function playCurrentVideo() {
  const { section } = getCurrentSection();
  const bg = document.getElementById('bg-' + section.bg);
  if (bg) {
    const video = bg.querySelector('video');
    if (video) video.play().catch(() => {});
  }
}

function pauseAllVideos() {
  document.querySelectorAll('video').forEach(v => v.pause());
}

// 重置
function resetTime() {
  currentTime = 0;
  isPlaying = false;
  document.getElementById('playBtn').textContent = '▶ 播放';
  stopTimer();
  pauseAllVideos();
  updateDisplay();
}

// 跳转
function jumpTo(seconds) {
  currentTime = seconds;
  updateDisplay();
  if (isPlaying) {
    playCurrentVideo();
  }
}

// 进度条点击
function seekProgress(event) {
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  const percent = (event.clientX - rect.left) / rect.width;
  currentTime = percent * TOTAL_DURATION;
  updateDisplay();
  if (isPlaying) playCurrentVideo();
}

// 速度
function setSpeed(speed) {
  playSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.toggle('active', parseFloat(btn.textContent) === speed);
  });
}

// 全屏
function toggleFullscreen() {
  const preview = document.querySelector('.preview-section');
  if (!document.fullscreenElement) {
    preview.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  switch(e.code) {
    case 'Space':
      e.preventDefault();
      togglePlay();
      break;
    case 'KeyR':
      resetTime();
      break;
    case 'ArrowLeft':
      currentTime = Math.max(0, currentTime - 5);
      updateDisplay();
      if (isPlaying) playCurrentVideo();
      break;
    case 'ArrowRight':
      currentTime = Math.min(TOTAL_DURATION, currentTime + 5);
      updateDisplay();
      if (isPlaying) playCurrentVideo();
      break;
    case 'ArrowUp':
      e.preventDefault();
      playSpeed = Math.min(2, playSpeed + 0.25);
      updateSpeedButtons();
      break;
    case 'ArrowDown':
      e.preventDefault();
      playSpeed = Math.max(0.25, playSpeed - 0.25);
      updateSpeedButtons();
      break;
    case 'KeyF':
      toggleFullscreen();
      break;
  }
});

function updateSpeedButtons() {
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.toggle('active', parseFloat(btn.textContent) === playSpeed);
  });
}

// 初始化
generateTimeline();
updateDisplay();
</script>
</body>
</html>
